<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OGD-live</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fa;
      --surface: #ffffff;
      --border: #e2e5ea;
      --text: #1c1f26;
      --text-muted: #6b7280;
      --accent: #2f6feb;
      --accent-contrast: #ffffff;
      --error: #b3261e;
      --error-bg: #fdecea;
      --ok: #1a7f4e;
      --ok-bg: #e8f6ef;
      --radius: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --surface: #1c1f26;
        --border: #2c3037;
        --text: #e7e9ee;
        --text-muted: #9aa1ac;
        --accent: #6ea1ff;
        --accent-contrast: #0b0d10;
        --error: #ff8a80;
        --error-bg: #3a1f1e;
        --ok: #6fd8a4;
        --ok-bg: #133226;
      }
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 720px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
      line-height: 1.5;
    }

    header { margin-bottom: 1.75rem; }
    h1 { font-size: 1.5rem; margin: 0 0 0.35rem; }
    header p { color: var(--text-muted); margin: 0; font-size: 0.95rem; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }
    .card h2 {
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin: 0 0 1rem;
    }

    .field { margin-bottom: 1rem; }
    .field:last-child { margin-bottom: 0; }
    .field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    .field .hint {
      display: block;
      font-weight: 400;
      color: var(--text-muted);
      font-size: 0.78rem;
      margin-top: 0.2rem;
    }
    input, select {
      width: 100%;
      padding: 0.55rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
    }
    input:focus, select:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .row { display: flex; gap: 1rem; }
    .row .field { flex: 1; }

    button {
      appearance: none;
      border: none;
      border-radius: 6px;
      padding: 0.65rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: var(--accent-contrast);
    }
    button:disabled { opacity: 0.6; cursor: default; }
    button.secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    #run-btn { margin-top: 0.5rem; width: 100%; }

    #status-card { display: none; }
    #status-line {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .dot {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--text-muted);
    }
    .dot.running { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
    .dot.done { background: var(--ok); }
    .dot.error { background: var(--error); }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    #status-line.error { color: var(--error); }
    #status-line.done { color: var(--ok); }

    #files { margin-top: 1rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
    #files a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: 0.82rem;
    }
    #files a:hover { border-color: var(--accent); color: var(--accent); }
    #files a::before { content: "⬇"; font-size: 0.75rem; }

    #visualize-btn { margin-top: 1.25rem; display: none; }
    #viewer-frame {
      width: 100%;
      height: 600px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-top: 1rem;
      display: none;
      background: var(--surface);
    }

    .banner {
      padding: 0.6rem 0.9rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-top: 0.75rem;
    }
    .banner.error { background: var(--error-bg); color: var(--error); }
  </style>
</head>
<body>
  <header>
    <h1>OGD-live</h1>
    <p>Orthologous Group Delineation from a gene tree (Newick).</p>
  </header>

  <form id="analysis-form" class="card">
    <h2>Analysis</h2>

    <div class="field">
      <label for="tree-input">Gene tree</label>
      <input id="tree-input" type="file" name="tree" accept=".nw,.nwk,.newick" required>
      <span class="hint">Newick format, leaves named as SpeciesID.Gene (e.g. 9606.ENSP00000269305)</span>
    </div>

    <div class="row">
      <div class="field">
        <label for="rooting-input">Rooting</label>
        <select id="rooting-input" name="rooting">
          <option value="Midpoint">Midpoint</option>
          <option value="MinVar">MinVar</option>
        </select>
      </div>
      <div class="field">
        <label for="delim-input">Species delimiter</label>
        <input id="delim-input" type="text" name="sp_delimitator" value=".">
      </div>
    </div>

    <div class="field">
      <label for="ovlap-input">Global Species Overlap threshold</label>
      <input id="ovlap-input" type="number" step="0.01" min="0" max="1" name="sp_ovlap_all" value="0.1">
      <span class="hint">Higher value → fewer duplications, fewer and larger OGs. Lower value → more duplications, more and smaller OGs</span>
    </div>

    <button id="run-btn" type="submit">Run analysis</button>
  </form>

  <div id="status-card" class="card">
    <h2>Progress</h2>
    <span id="status-line"><span id="status-dot" class="dot"></span><span id="status-text">—</span></span>
    <div id="error-banner" class="banner error" style="display:none"></div>
    <div id="files"></div>
    <button id="visualize-btn" class="secondary">View interactive tree</button>
    <iframe id="viewer-frame" title="Interactive tree visualization"></iframe>
  </div>

  <script>
    const FILE_LABELS = {
      tree_annot: 'Annotated tree (.nw)',
      ogs_info: 'OG table',
      seq2ogs_tsv: 'Sequence → OG (.tsv)',
      seq2ogs_jsonl: 'Sequence → OG (.jsonl)',
      pairs: 'Ortholog pairs',
      strict_pairs: 'Strict pairs',
    };

    const form = document.getElementById('analysis-form');
    const runBtn = document.getElementById('run-btn');
    const statusCard = document.getElementById('status-card');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const statusLine = document.getElementById('status-line');
    const errorBanner = document.getElementById('error-banner');
    const filesEl = document.getElementById('files');
    const visualizeBtn = document.getElementById('visualize-btn');
    const viewerFrame = document.getElementById('viewer-frame');

    function setStatus(kind, text) {
      statusDot.className = 'dot ' + kind;
      statusLine.className = kind === 'error' ? 'error' : (kind === 'done' ? 'done' : '');
      statusText.textContent = text;
    }

    function showError(message) {
      errorBanner.textContent = message;
      errorBanner.style.display = 'block';
    }

    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();

      statusCard.style.display = 'block';
      errorBanner.style.display = 'none';
      filesEl.innerHTML = '';
      visualizeBtn.style.display = 'none';
      viewerFrame.style.display = 'none';
      viewerFrame.src = '';
      runBtn.disabled = true;
      setStatus('running', 'Uploading tree…');

      const formData = new FormData(form);
      let response;
      try {
        response = await fetch('/api/analyses', { method: 'POST', body: formData });
      } catch (err) {
        setStatus('error', 'Network error');
        showError(String(err));
        runBtn.disabled = false;
        return;
      }

      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        setStatus('error', 'Could not start the analysis');
        showError(body.detail || `HTTP ${response.status}`);
        runBtn.disabled = false;
        return;
      }

      const { job_id } = await response.json();
      setStatus('running', 'Queued…');

      const events = new EventSource(`/api/analyses/${job_id}/events`);

      events.addEventListener('status', async (ev) => {
        if (ev.data === 'running') {
          setStatus('running', 'Running pipeline…');
        } else if (ev.data === 'done') {
          setStatus('done', 'Completed');
          runBtn.disabled = false;
          events.close();

          const res = await fetch(`/api/analyses/${job_id}`);
          const data = await res.json();
          filesEl.innerHTML = '';
          for (const [name, url] of Object.entries(data.files)) {
            const a = document.createElement('a');
            a.href = url;
            a.textContent = FILE_LABELS[name] || name;
            filesEl.appendChild(a);
          }

          visualizeBtn.style.display = 'inline-block';
          visualizeBtn.onclick = async () => {
            visualizeBtn.disabled = true;
            visualizeBtn.textContent = 'Loading viewer…';
            try {
              const vres = await fetch(`/api/analyses/${job_id}/visualize`, { method: 'POST' });
              if (!vres.ok) {
                const body = await vres.json().catch(() => ({}));
                showError('Failed to start visualization: ' + (body.detail || vres.status));
                return;
              }
              const { viewer_url } = await vres.json();
              viewerFrame.src = viewer_url;
              viewerFrame.style.display = 'block';
            } finally {
              visualizeBtn.disabled = false;
              visualizeBtn.textContent = 'View interactive tree';
            }
          };
        } else if (ev.data === 'error') {
          setStatus('error', 'Analysis failed');
          runBtn.disabled = false;
          events.close();
        }
      });

      events.onerror = () => {
        events.close();
      };
    });
  </script>
</body>
</html>
